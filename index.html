<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Patient Monitor (Bluetooth)</title>
    <style>
        body { 
            background-color: #000; color: #00ff00; font-family: monospace; 
            margin: 0; padding: 20px; box-sizing: border-box; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid #222; padding-bottom: 10px; 
        }
        .header h2 { margin: 0; font-size: 1.8rem; color: #00ff00; letter-spacing: 2px; }
        .status-tag { font-size: 0.9rem; color: #ffaa00; margin-left: 10px; transition: color 0.3s; }
        
        .controls { display: flex; gap: 10px; }
        button { 
            background: #111; color: #fff; border: 1px solid #444; 
            padding: 10px 20px; border-radius: 5px; font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        button:hover { border-color: #00ff00; }
        .btn-connect { background: #004400; border-color: #00ff00; font-weight: bold; }
        .btn-disconnect { background: #440000; border-color: #ff0000; display: none; }

        .container { display: flex; flex: 1; margin-top: 15px; gap: 15px; }
        .chart-box { 
            flex: 2.2; background: #030303; border: 2px solid #1a1a1a; 
            border-radius: 8px; position: relative; 
        }
        canvas { width: 100%; height: 100%; display: block; }
        
        .vitals-box { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .card { 
            background: #080808; padding: 25px; border-radius: 12px; 
            border: 2px solid #555; box-shadow: none;
            display: flex; flex-direction: column; justify-content: space-between; height: 80%;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card.online { border-color: #00ff00; box-shadow: 0 0 15px rgba(0, 255, 0, 0.15); }
        .card-title { font-size: 1.8rem; font-weight: bold; color: #555; }
        .card.online .card-title { color: #00ff00; }
        
        .val { 
            font-size: 7.5rem; font-weight: bold; text-align: right; 
            line-height: 1; margin: 20px 0; color: #444; transition: color 0.3s;
        }
        .card.online .val { color: #00ff00; text-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
        .unit { text-align: right; font-size: 1.8rem; color: #444; }
        .card.online .unit { color: #00cc00; }

        .heart-icon { display: inline-block; transition: transform 0.1s; }
        .pulse { transform: scale(1.3); }
    </style>
</head>
<body>

    <div class="header">
        <h2>BED 01 - LOCAL MONITOR <span class="status-tag" id="syncStatus">● WAITING BLUETOOTH</span></h2>
        <div class="controls">
            <button id="connectBtn" class="btn-connect" onclick="connectBluetooth()">🔌 เชื่อมต่อนาฬิกา (Connect)</button>
            <button id="disconnectBtn" class="btn-disconnect" onclick="disconnectBluetooth()">❌ ตัดการเชื่อมต่อ</button>
            <button id="soundBtn" onclick="toggleSound()">🔊 เปิดเสียงปี๊บ</button>
        </div>
    </div>

    <div class="container">
        <div class="chart-box">
            <canvas id="ecgCanvas"></canvas>
        </div>
        <div class="vitals-box">
            <div class="card hr" id="hrCard">
                <div class="card-title"><span id="heart" class="heart-icon">❤️</span> HR (Pulse)</div>
                <div class="val" id="hrValue">--</div>
                <div class="unit">BPM</div>
            </div>
        </div>
    </div>

    <script>
        let currentBPM = 0;
        let isOnline = false;
        let bluetoothDevice = null;
        let audioCtx = null;
        let soundEnabled = false;

        // *** 1. ระบบเสียง ***
        function toggleSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.innerText = soundEnabled ? '🔊 เสียงปี๊บ: เปิด' : '🔇 เสียงปี๊บ: ปิด';
            btn.style.background = soundEnabled ? '#006600' : '#111';
        }

        function playBeep() {
            if (!soundEnabled || !audioCtx || !isOnline) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.07);
            } catch (e) {}
        }

        // *** 2. ระบบวาดกราฟ ECG ***
        const canvas = document.getElementById('ecgCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let x = 0;
        let lastY = canvas.height / 2;
        let lastBeatTime = Date.now();

        function drawECG() {
            const centerY = canvas.height / 2;
            const now = Date.now();
            let y = centerY + (Math.sin(x * 0.08) * 2) + (Math.random() * 2 - 1); // Noise พื้นฐาน

            if (isOnline && currentBPM > 30) {
                const beatInterval = (60 / currentBPM) * 1000;
                if (now - lastBeatTime >= beatInterval) {
                    y = centerY - (canvas.height * 0.35); // จุดพีคกราฟ QRS
                    playBeep();
                    
                    const heart = document.getElementById('heart');
                    if (heart) {
                        heart.classList.add('pulse');
                        setTimeout(() => heart.classList.remove('pulse'), 150);
                    }
                    lastBeatTime = now;
                }
            }

            ctx.strokeStyle = isOnline ? '#00ff00' : '#444444';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x, lastY);
            ctx.lineTo(x + 2, y);
            ctx.stroke();
            ctx.clearRect(x + 3, 0, 15, canvas.height); // ลบเส้นเก่า

            lastY = y;
            x += 2.2;
            if (x > canvas.width) x = 0;

            requestAnimationFrame(drawECG);
        }
        drawECG();

        // *** 3. ระบบ Web Bluetooth API (ดึงตรงจาก Garmin) ***
        async function connectBluetooth() {
            try {
                // ขอสิทธิ์ค้นหาอุปกรณ์ที่มี Heart Rate Service (UUID: 0x180D)
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: ['heart_rate'] }]
                });

                // ตรวจจับตอนสัญญาณหลุด (เช่น ถอดนาฬิกา / เดินออกนอกระยะ)
                bluetoothDevice.addEventListener('gattserverdisconnected', setOfflineState);

                document.getElementById('syncStatus').innerText = '● CONNECTING...';
                document.getElementById('syncStatus').style.color = '#ffaa00';

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('heart_rate');
                const characteristic = await service.getCharacteristic('heart_rate_measurement');
                
                // เริ่มรับข้อมูลแบบ Real-time
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', handleHeartRateData);
                
                // อัปเดต UI เมื่อต่อสำเร็จ
                document.getElementById('connectBtn').style.display = 'none';
                document.getElementById('disconnectBtn').style.display = 'inline-block';
                setOnlineState();

            } catch (error) {
                console.error("Bluetooth Connection Failed:", error);
                alert("การเชื่อมต่อล้มเหลว หรือถูกยกเลิก (ต้องเปิด Broadcast HR ที่นาฬิกาด้วยนะครับ)");
                setOfflineState();
            }
        }

        // แปลงรหัสข้อมูล Bluetooth เป็นตัวเลข BPM
        function handleHeartRateData(event) {
            const value = event.target.value;
            const flags = value.getUint8(0);
            const rate16Bits = flags & 0x1;
            let heartRate;
            
            if (rate16Bits) {
                heartRate = value.getUint16(1, /*littleEndian=*/true);
            } else {
                heartRate = value.getUint8(1);
            }
            
            currentBPM = heartRate;
            document.getElementById('hrValue').innerText = currentBPM;
            
            // เช็กกรณีนาฬิกาส่งค่า 0 มาให้ถือว่า Offline
            if (currentBPM === 0) {
                setOfflineState();
            } else if (!isOnline) {
                setOnlineState();
            }
        }

        function disconnectBluetooth() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
        }

        function setOnlineState() {
            isOnline = true;
            document.getElementById('hrCard').classList.add('online');
            document.getElementById('syncStatus').innerText = '● BLUETOOTH LIVE';
            document.getElementById('syncStatus').style.color = '#00ff00';
        }

        function setOfflineState() {
            isOnline = false;
            currentBPM = 0;
            document.getElementById('hrValue').innerText = '--';
            document.getElementById('hrCard').classList.remove('online');
            document.getElementById('syncStatus').innerText = '● DISCONNECTED';
            document.getEl
