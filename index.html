<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Patient Monitor</title>
    <style>
        body { 
            background-color: #000; 
            color: #00ff00; 
            font-family: monospace; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #222; 
            padding-bottom: 10px; 
        }
        .header h2 {
            margin: 0;
            font-size: 1.8rem;
            color: #00ff00;
            letter-spacing: 2px;
        }
        .status-tag {
            font-size: 0.9rem;
            color: #00ff00;
            margin-left: 10px;
        }
        .container { 
            display: flex; 
            flex: 1; 
            margin-top: 15px; 
            gap: 15px;
        }
        .chart-box { 
            flex: 2.2; 
            background: #030303; 
            border: 2px solid #1a1a1a; 
            border-radius: 8px;
            position: relative; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block;
        }
        .vitals-box { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .card { 
            background: #080808; 
            padding: 15px; 
            border-radius: 12px; 
            border: 2px solid #00ff00; 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 80%;
            overflow: hidden;
            position: relative;
        }
        .card-title {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .pulsoid-frame {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
            background: transparent;
        }
        button { 
            background: #111; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 10px 20px; 
            border-radius: 5px; 
            font-size: 1rem; 
            cursor: pointer; 
        }
        button:hover {
            border-color: #00ff00;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Purch C. - PATIENT MONITOR <span class="status-tag" id="syncStatus">● LIVE SYNC</span></h2>
        <button id="soundBtn" onclick="toggleSound()">🔊 เปิดเสียงปี๊บ (Enable Sound)</button>
    </div>

    <div class="container">
        <div class="chart-box">
            <canvas id="ecgCanvas"></canvas>
        </div>
        <div class="vitals-box">
            <div class="card hr">
                <div class="card-title">❤️ HR (Pulse)</div>
                <iframe id="pulsoidFrame" class="pulsoid-frame" src="https://pulsoid.net/widget/view/0f9acd52-7d11-4156-8b62-ce37b11067bb" allow="autoplay"></iframe>
            </div>
        </div>
    </div>

    <script>
        const WIDGET_ID = "0f9acd52-7d11-4156-8b62-ce37b11067bb";
        
        let currentBPM = 70; // ค่าเริ่มต้นสำหรับสปีดกราฟ
        let isOnline = true;

        let audioCtx = null;
        let soundEnabled = false;

        function toggleSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.innerText = soundEnabled ? '🔊 เสียงปี๊บ: เปิด' : '🔇 เสียงปี๊บ: ปิด';
            btn.style.background = soundEnabled ? '#006600' : '#111';
        }

        function playBeep() {
            if (!soundEnabled || !audioCtx || !isOnline) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.07);
            } catch (e) {}
        }

        const canvas = document.getElementById('ecgCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let x = 0;
        let lastY = canvas.height / 2;
        let lastBeatTime = Date.now();

        function drawECG() {
            const centerY = canvas.height / 2;
            const now = Date.now();
            
            let y = centerY + (Math.sin(x * 0.08) * 2) + (Math.random() * 2 - 1);

            if (isOnline) {
                const beatInterval = (60 / currentBPM) * 1000;
                if (now - lastBeatTime >= beatInterval) {
                    y = centerY - (canvas.height * 0.35); // วาดจุดพีค QRS
                    playBeep();
                    lastBeatTime = now;
                }
            }

            ctx.strokeStyle = isOnline ? '#00ff00' : '#444444';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x, lastY);
            ctx.lineTo(x + 2, y);
            ctx.stroke();

            ctx.clearRect(x + 3, 0, 15, canvas.height);

            lastY = y;
            x += 2.2;
            if (x > canvas.width) x = 0;

            requestAnimationFrame(drawECG);
        }
        drawECG();

        // ดึงค่า BPM เพื่อปรับสปีดกราฟแบบยืดหยุ่น (ผ่าน Proxy กันบล็อก)
        async function updateBPM() {
            try {
                const proxyRes = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://ramen.pulsoid.net/v1/live/' + WIDGET_ID)}`);
                if (proxyRes.ok) {
                    const proxyJson = await proxyRes.json();
                    const data = JSON.parse(proxyJson.contents);
                    if (data && data.bpm) {
                        currentBPM = data.bpm;
                        isOnline = true;
                        document.getElementById('syncStatus').innerText = '● LIVE SYNC';
                        document.getElementById('syncStatus').style.color = '#00ff00';
                        return;
                    }
                }
            } catch (e) {}
            
            // หากดึงสปีดไม่ได้ กราฟยังคงวาดที่สปีดปกติ (70 BPM) โดยอาศัย iframe แสดงตัวเลขสด
            isOnline = true;
            document.getElementById('syncStatus').innerText = '● LIVE (WIDGET)';
            document.getElementById('syncStatus').style.color = '#00ff00';
        }

        setInterval(updateBPM, 3000);
        updateBPM();
    </script>
</body>
</html>
