<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Patient Monitor</title>
    <style>
        body { 
            background-color: #000; 
            color: #00ff00; 
            font-family: monospace; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #222; 
            padding-bottom: 10px; 
        }
        .header h2 {
            margin: 0;
            font-size: 1.8rem;
            color: #00ff00;
            letter-spacing: 2px;
        }
        .status-tag {
            font-size: 0.9rem;
            color: #00ff00;
            margin-left: 10px;
            transition: color 0.3s;
        }
        .container { 
            display: flex; 
            flex: 1; 
            margin-top: 15px; 
            gap: 15px;
        }
        .chart-box { 
            flex: 2.2; 
            background: #030303; 
            border: 2px solid #1a1a1a; 
            border-radius: 8px;
            position: relative; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block;
        }
        .vitals-box { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .card { 
            background: #080808; 
            padding: 25px; 
            border-radius: 12px; 
            border: 2px solid #00ff00; 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 80%;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card.offline {
            border-color: #555;
            box-shadow: none;
        }
        .card-title {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .val { 
            font-size: 7.5rem; 
            font-weight: bold; 
            text-align: right; 
            line-height: 1;
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            color: #00ff00;
            transition: color 0.3s;
        }
        .val.offline {
            color: #555;
            text-shadow: none;
        }
        .unit { 
            text-align: right; 
            font-size: 1.8rem; 
            color: #00cc00;
        }
        button { 
            background: #111; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 10px 20px; 
            border-radius: 5px; 
            font-size: 1rem; 
            cursor: pointer; 
        }
        button:hover {
            border-color: #00ff00;
        }
        .heart-icon {
            display: inline-block;
            transition: transform 0.1s;
        }
        .pulse {
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Purch C. - MONITOR <span class="status-tag" id="syncStatus">● LIVE SYNC</span></h2>
        <button id="soundBtn" onclick="toggleSound()">🔊 เปิดเสียงปี๊บ (Enable Sound)</button>
    </div>

    <div class="container">
        <div class="chart-box">
            <canvas id="ecgCanvas"></canvas>
        </div>
        <div class="vitals-box">
            <div class="card hr" id="hrCard">
                <div class="card-title"><span id="heart" class="heart-icon">❤️</span> HR (Pulse)</div>
                <div class="val" id="hrValue">--</div>
                <div class="unit">BPM</div>
            </div>
        </div>
    </div>

    <script>
        const WIDGET_ID = "0f9acd52-7d11-4156-8b62-ce37b11067bb";
        
        let currentBPM = 0; // 0 = Offline / Flatline
        let lastBPMValue = null;
        let lastBPMChangeTime = Date.now();
        let isOnline = false;

        let audioCtx = null;
        let soundEnabled = false;

        // *** 1. ระบบเสียง Beep ***
        function toggleSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.innerText = soundEnabled ? '🔊 เสียงปี๊บ: เปิด' : '🔇 เสียงปี๊บ: ปิด';
            btn.style.background = soundEnabled ? '#006600' : '#111';
        }

        function playBeep() {
            if (!soundEnabled || !audioCtx || !isOnline) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.07);
            } catch (e) {}
        }

        // *** 2. ระบบวาดกราฟ ECG (เต้นตาม BPM หรือ Flatline เมื่อ Offline) ***
        const canvas = document.getElementById('ecgCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let x = 0;
        let lastY = canvas.height / 2;
        let lastBeatTime = Date.now();

        function drawECG() {
            const centerY = canvas.height / 2;
            const now = Date.now();
            
            let y = centerY + (Math.sin(x * 0.08) * 2) + (Math.random() * 2 - 1); // Baseline Noise

            if (isOnline && currentBPM > 30) {
                const beatInterval = (60 / currentBPM) * 1000;
                if (now - lastBeatTime >= beatInterval) {
                    y = centerY - (canvas.height * 0.35); // วาดลูกคลื่น QRS
                    playBeep();
                    
                    const heart = document.getElementById('heart');
                    if (heart) {
                        heart.classList.add('pulse');
                        setTimeout(() => heart.classList.remove('pulse'), 150);
                    }
                    lastBeatTime = now;
                }
            }

            ctx.strokeStyle = isOnline ? '#00ff00' : '#555555';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x, lastY);
            ctx.lineTo(x + 2, y);
            ctx.stroke();

            ctx.clearRect(x + 3, 0, 15, canvas.height);

            lastY = y;
            x += 2.2;
            if (x > canvas.width) x = 0;

            requestAnimationFrame(drawECG);
        }
        drawECG();

        // *** 3. ระบบดึงค่า Pulsoid พร้อมตรวจสอบสัญญาณ Timeout (10 วินาที) ***
        async function fetchBPM() {
            try {
                const res = await fetch(`https://ramen.pulsoid.net/v1/live/${WIDGET_ID}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.bpm) {
                        const newBPM = data.bpm;
                        const now = Date.now();

                        // เช็กว่าตัวเลขมีการเปลี่ยนค่าไหม
                        if (newBPM !== lastBPMValue) {
                            lastBPMValue = newBPM;
                            lastBPMChangeTime = now; // รีเซ็ตเวลาอัปเดตล่าสุด
                        }

                        // ถ้าตัวเลขค้างเดิมเกิน 10 วินาที ให้ถือว่าถอดนาฬิกา / สัญญาณขาด
                        if (now - lastBPMChangeTime > 10000) {
                            setOfflineState();
                        } else {
                            setOnlineState(newBPM);
                        }
                        return;
                    }
                }
            } catch (e) {}

            setOfflineState();
        }

        function setOnlineState(bpm) {
            isOnline = true;
            currentBPM = bpm;
            document.getElementById('hrValue').innerText = bpm;
            document.getElementById('hrValue').classList.remove('offline');
            document.getElementById('hrCard').classList.remove('offline');
            document.getElementById('syncStatus').innerText = '● LIVE SYNC';
            document.getElementById('syncStatus').style.color = '#00ff00';
        }

        function setOfflineState() {
            isOnline = false;
            currentBPM = 0;
            document.getElementById('hrValue').innerText = '--';
            document.getElementById('hrValue').classList.add('offline');
            document.getElementById('hrCard').classList.add('offline');
            document.getElementById('syncStatus').innerText = '● DISCONNECTED';
            document.getElementById('syncStatus').style.color = '#ff3333';
        }

        setInterval(fetchBPM, 2000);
        fetchBPM();
    </script>
</body>
</html>
