<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Patient Monitor</title>
    <style>
        body { 
            background-color: #000; 
            color: #00ff00; 
            font-family: monospace; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #222; 
            padding-bottom: 10px; 
        }
        .header h2 {
            margin: 0;
            font-size: 1.8rem;
            color: #00ff00;
            letter-spacing: 2px;
        }
        .status-tag {
            font-size: 0.9rem;
            color: #00ff00;
            margin-left: 10px;
            transition: color 0.3s;
        }
        .container { 
            display: flex; 
            flex: 1; 
            margin-top: 15px; 
            gap: 15px;
        }
        .chart-box { 
            flex: 2.2; 
            background: #030303; 
            border: 2px solid #1a1a1a; 
            border-radius: 8px;
            position: relative; 
        }
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block;
        }
        .vitals-box { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        .card { 
            background: #080808; 
            padding: 15px; 
            border-radius: 12px; 
            border: 2px solid #00ff00; 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 80%;
            overflow: hidden;
            position: relative;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card.offline {
            border-color: #444;
            box-shadow: none;
        }
        .card-title {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .pulsoid-frame {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
            background: transparent;
            display: block;
        }
        .pulsoid-frame.hidden {
            display: none;
        }
        .val-offline {
            font-size: 7.5rem;
            font-weight: bold;
            text-align: right;
            line-height: 1;
            margin: 20px 0;
            color: #444;
            display: none;
        }
        .val-offline.show {
            display: block;
        }
        .unit { 
            text-align: right; 
            font-size: 1.8rem; 
            color: #00cc00;
        }
        button { 
            background: #111; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 10px 20px; 
            border-radius: 5px; 
            font-size: 1rem; 
            cursor: pointer; 
        }
        button:hover {
            border-color: #00ff00;
        }
        .heart-icon {
            display: inline-block;
            transition: transform 0.1s;
        }
        .pulse {
            transform: scale(1.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Purch C. - PATIENT MONITOR <span class="status-tag" id="syncStatus">● CONNECTING...</span></h2>
        <button id="soundBtn" onclick="toggleSound()">🔊 เปิดเสียงปี๊บ (Enable Sound)</button>
    </div>

    <div class="container">
        <div class="chart-box">
            <canvas id="ecgCanvas"></canvas>
        </div>
        <div class="vitals-box">
            <div class="card hr" id="hrCard">
                <div class="card-title"><span id="heart" class="heart-icon">❤️</span> HR (Pulse)</div>
                <iframe id="pulsoidFrame" class="pulsoid-frame" src="https://pulsoid.net/widget/view/0f9acd52-7d11-4156-8b62-ce37b11067bb" allow="autoplay"></iframe>
                <div class="val-offline" id="offlineVal">--</div>
                <div class="unit">BPM</div>
            </div>
        </div>
    </div>

    <script>
        const WIDGET_ID = "0f9acd52-7d11-4156-8b62-ce37b11067bb";
        
        let currentBPM = 72;
        let lastBPMValue = null;
        let lastBPMChangeTime = Date.now();
        let isOnline = false;

        let audioCtx = null;
        let soundEnabled = false;

        function toggleSound() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.innerText = soundEnabled ? '🔊 เสียงปี๊บ: เปิด' : '🔇 เสียงปี๊บ: ปิด';
            btn.style.background = soundEnabled ? '#006600' : '#111';
        }

        function playBeep() {
            if (!soundEnabled || !audioCtx || !isOnline) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.07);
            } catch (e) {}
        }

        const canvas = document.getElementById('ecgCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let x = 0;
        let lastY = canvas.height / 2;
        let lastBeatTime = Date.now();

        function drawECG() {
            const centerY = canvas.height / 2;
            const now = Date.now();
            
            let y = centerY + (Math.sin(x * 0.08) * 2) + (Math.random() * 2 - 1);

            if (isOnline && currentBPM > 30) {
                const beatInterval = (60 / currentBPM) * 1000;
                if (now - lastBeatTime >= beatInterval) {
                    y = centerY - (canvas.height * 0.35);
                    playBeep();
                    
                    const heart = document.getElementById('heart');
                    if (heart) {
                        heart.classList.add('pulse');
                        setTimeout(() => heart.classList.remove('pulse'), 150);
                    }
                    lastBeatTime = now;
                }
            }

            ctx.strokeStyle = isOnline ? '#00ff00' : '#444444';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(x, lastY);
            ctx.lineTo(x + 2, y);
            ctx.stroke();

            ctx.clearRect(x + 3, 0, 15, canvas.height);

            lastY = y;
            x += 2.2;
            if (x > canvas.width) x = 0;

            requestAnimationFrame(drawECG);
        }
        drawECG();

        // ระบบดึงข้อมูลแบบสลับ Proxy อัตโนมัติ (Multi-Proxy Failover)
        async function fetchBPM() {
            const now = Date.now();
            let bpm = null;

            // วิธีที่ 1: ดึงตรงจาก Pulsoid API
            try {
                const res = await fetch(`https://ramen.pulsoid.net/v1/live/${WIDGET_ID}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.bpm) bpm = data.bpm;
                }
            } catch (e) {}

            // วิธีที่ 2: ใช้ Corsproxy.io
            if (!bpm) {
                try {
                    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent('https://ramen.pulsoid.net/v1/live/' + WIDGET_ID)}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.bpm) bpm = data.bpm;
                    }
                } catch (e) {}
            }

            // วิธีที่ 3: ใช้ Allorigins
            if (!bpm) {
                try {
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://ramen.pulsoid.net/v1/live/' + WIDGET_ID)}`);
                    if (res.ok) {
                        const proxyData = await res.json();
                        const data = JSON.parse(proxyData.contents);
                        if (data && data.bpm) bpm = data.bpm;
                    }
                } catch (e) {}
            }

            if (bpm) {
                if (bpm !== lastBPMValue) {
                    lastBPMValue = bpm;
                    lastBPMChangeTime = now;
                }

                // ถ้าตัวเลขค้างซ้ำเดิมเกิน 12 วินาที = ปิดแอป/ถอดนาฬิกา
                if (now - lastBPMChangeTime > 12000) {
                    setOffline();
                } else {
                    setOnline(bpm);
                }
            } else {
                // หาก Proxy บล็อก ให้รันผ่าน iframe widget แสดงตัวเลขแทน
                setWidgetFallback();
            }
        }

        function setOnline(bpm) {
            isOnline = true;
            currentBPM = bpm;
            document.getElementById('pulsoidFrame').classList.remove('hidden');
            document.getElementById('offlineVal').classList.remove('show');
            document.getElementById('hrCard').classList.remove('offline');
            document.getElementById('syncStatus').innerText = '● LIVE SYNC';
            document.getElementById('syncStatus').style.color = '#00ff00';
        }

            isOnline = true;
            docu
